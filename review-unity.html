<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Review - Unity Pitstop Series</title>
    <link rel="stylesheet" href="index.css"> 
</head>
<body>

    <div class="app-container-review">
        
        <a href="./painting-space.html" class="btn-back-pita-timeline" style="top: 19px;">
            <img src="./images/pita back.png" alt="Back to Painting Space">
        </a>

        <div class="vertical-scroll-zone">
            <div class="zoom-wrapper backend-unity-stack">
                <img src="./images/uzone.png" class="review-unity-img-1" alt="Unity Part 1">
                <img src="./images/uzone PITSTOP.png" class="review-unity-img-2" alt="Unity Part 2">
                <img src="./images/uzone erau 2016.png" class="review-unity-img-3" alt="Unity Part 3">
            </div>
        </div>

        <div class="text-pink-blink-review">
            DBL-CLICK TO ZOOM ON CURSOR / DRAG ANYWHERE
        </div>

    </div>

    <script>
        const zone = document.querySelector('.vertical-scroll-zone');
        const wrapper = document.querySelector('.zoom-wrapper');
        const img = document.querySelector('.unity-part-one'); 
        
        let isDown = false;
        let startX, startY;
        let scrollLeft, scrollTop;
        let isZoomed = false;

        // --- 1. MOUSE DRAG ENGINE ---
        zone.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault(); 
            isDown = true;
            zone.style.cursor = 'grabbing';
            startX = e.pageX - zone.offsetLeft;
            startY = e.pageY - zone.offsetTop;
            scrollLeft = zone.scrollLeft;
            scrollTop = zone.scrollTop;
        });

        zone.addEventListener('mouseleave', () => {
            isDown = false;
            zone.style.cursor = isZoomed ? 'zoom-out' : 'grab';
        });

        zone.addEventListener('mouseup', () => {
            isDown = false;
            zone.style.cursor = isZoomed ? 'zoom-out' : 'grab';
        });

        zone.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - zone.offsetLeft;
            const y = e.pageY - zone.offsetTop;
            const walkX = (x - startX) * 1.5; 
            const walkY = (y - startY) * 1.5; 
            zone.scrollLeft = scrollLeft - walkX;
            zone.scrollTop = scrollTop - walkY;
        });

        // --- 2. DOUBLE CLICK ZOOM ENGINE ---
        zone.addEventListener('dblclick', (e) => {
            isZoomed = !isZoomed;
            if (isZoomed) {
                const rect = zone.getBoundingClientRect();
                const offsetX = e.clientX - rect.left + zone.scrollLeft;
                const offsetY = e.clientY - rect.top + zone.scrollTop;
                
                const pctX = (offsetX / img.offsetWidth) * 100;
                const pctY = (offsetY / wrapper.offsetHeight) * 100; 
                wrapper.style.transformOrigin = `${pctX}% ${pctY}%`;
                
                wrapper.classList.add('zoomed-active');
                zone.style.overflowX = 'auto'; 
                zone.style.cursor = 'zoom-out';
                
                setTimeout(() => {
                    zone.scrollTop = offsetY * 1.8 - (zone.offsetHeight / 2);
                    zone.scrollLeft = offsetX * 1.8 - (zone.offsetWidth / 2);
                }, 50);
            } else {
                wrapper.style.transformOrigin = 'top center';
                wrapper.classList.remove('zoomed-active');
                zone.style.overflowX = 'hidden';
                zone.style.cursor = 'grab';
                zone.scrollLeft = 0;
            }
        });
  function autoLockViewport() {
    const container = document.querySelector('.app-container-review') || document.querySelector('.app-container');
    if (!container) return;

    const targetWidth = 430;
    const targetHeight = 966;
    
    const scaleX = window.innerWidth / targetWidth;
    const scaleY = window.innerHeight / targetHeight;
    
    // 1. Dapatkan hitungan skala asli dari browser Opera/HP saat ini
    let skalaAsli = Math.min(scaleX, scaleY);
    
    // 2. AKTIFKAN SYSTEM TITIK DASAR Z (LOGIKA MASTER ABANG DOEL)
    let finalScale;

    if (skalaAsli <= 0.80) {
        // Jika browser mencoba mengecil atau berada di bawah 80%, 
        // Paksa gembok mutlak di angka 67% (0.67 adalah TITIK DASAR Z, anti melorot ke 25%)
        finalScale = 0.67;
    } else {
        // Begitu masuk angka 80% ke atas, katup zoom-in aktif!
        // Batasi pembesaran atasnya mentok di 5.0 (500%) biar gak eror luber
        finalScale = Math.min(skalaAsli, 5.0);
    }
    
    // 3. Eksekusi ke rumah container
    container.style.transform = `scale(${finalScale})`;
    container.style.transformOrigin = 'top center'; // Mengunci posisi stabil rata tengah atas
}

window.addEventListener('resize', autoLockViewport);
window.addEventListener('DOMContentLoaded', autoLockViewport);
    </script>
</body>
</html>
