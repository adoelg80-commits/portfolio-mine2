<body>

                    <div class="logo-box" onclick="zoomThisPhoto('./images/DSC_0385.JPG')">

                </div> <div class="text-pink-blink-bawah">
                    TOUCH body angel for &lt; BACK &gt;
                </div>
        </div>
  <script>
    function lockFitLayar() {
        const container = document.querySelector('.app-container');
        if (!container) return;

        const skalaX = window.innerWidth / 430;
        const skalaY = window.innerHeight / 966; 

        const skalaFinal = Math.min(skalaX, skalaY);
        container.style.transform = `scale(${skalaFinal})`;
    }

    window.addEventListener('DOMContentLoaded', lockFitLayar);
    window.addEventListener('resize', lockFitLayar);

    // ==========================================
    // FUNGSI JALUR KHUSUS ZOOM FOTO
    // ==========================================
    function zoomThisPhoto(imageSrc) {
        const zoomZone = document.getElementById('main-photo-zoom-zone');
        const expandedPhoto = document.getElementById('expanded-photo');
        
        if (zoomZone && expandedPhoto) {
            expandedPhoto.src = imageSrc; 
            zoomZone.classList.add('fade-in-photo'); 
        }
    }

    document.getElementById('main-photo-zoom-zone').addEventListener('click', function() {
        this.classList.remove('fade-in-photo');
    });

    // ====================================================
    // MANTRA TAMBAHAN: BIAR DESKTOP BISA DI-SLIDE PAKE MOUSE
    // ====================================================
    const slider = document.querySelector('.slider-horizontal');
    let isDown = false;
    let startX;
    let scrollLeft;

    if (slider) {
        // Pas mouse ditekan di area slide
        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            slider.style.cursor = 'grabbing';
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        // Pas mouse meninggalkan area slide
        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.cursor = 'pointer';
        });

        // Pas klik mouse dilepas
        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.cursor = 'pointer';
        });

        // Pas mouse digerakkan sambil ditekan (DRAG)
        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return; 
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2; // Angka 2 ini kecepatan gesernya, makin besar makin ngebut
            slider.scrollLeft = scrollLeft - walk;
        });
    }
    </script>
</body>
</html>
