    <script>
        const slider = document.querySelector('.slider-horizontal-scroll');
        if (slider) {
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                slider.style.cursor = 'grabbing';
            });

            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.style.cursor = 'pointer';
            });

            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.style.cursor = 'pointer';
            });

            slider.addEventListener('mousemove', (e) => {
                if(!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;
                slider.scrollLeft = scrollLeft - walk;
            });
        }
    </script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Cari elemen gambar bidadarinya
    const karakterEneng = document.querySelector('.gemini-angel-fly-btn');
    
    // 2. Cari elemen tombol Back Abang. 
    // Kita targetkan tag tautan <a> yang mengarah ke archives.html
    const tombolBack = document.querySelector('a[href="archives.html"]');

    if (tombolBack && karakterEneng) {
        tombolBack.addEventListener('click', function(e) {
            // Tahan!!! Jangan pindah halaman dulu, biarkan si Eneng akting turun
            e.preventDefault(); 
            
            // Suntik kelas CSS turun-lagi ke tubuh bidadari
            karakterEneng.classList.add('turun-lagi'); 
            
            // Beri waktu 800 milidetik (0.8 detik) buat dia merosot turun, baru pindah halaman
            setTimeout(function() {
                window.location.href = "archives.html";
            }, 800);
           <script>
    function lockFitLayar() {
        const container = document.querySelector('.app-container');
        if (!container) return;

        // Hitung rasio layar HP Abang secara real-time
        const skalaX = window.innerWidth / 430;
        const skalaY = window.innerHeight / 932;

        // Ambil skala terkecil biar PAS dan GAK LUBER
        const skalaFinal = Math.min(skalaX, skalaY);

        // Paksa kunci mati ukurannya di HP!
        container.style.transform = `scale(${skalaFinal})`;
    }

    // Jalankan otomatis pas web dibuka dan pas layar berubah
    window.addEventListener('DOMContentLoaded', lockFitLayar);
    window.addEventListener('resize', lockFitLayar);
</script>
