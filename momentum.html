<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINE - Momentum</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="app-container">
        
        <div class="nebula-blue-layer">
            <img src="./images/Background nebula blue.png" alt="Nebula Blue" class="img-nebula-blue">
        </div>

        <div class="frame-tombol-bg">
            <img src="./images/Background slide 2.png" alt="Frame Slide 2" class="img-frame-bg">
        </div>

        <header class="momentum-header-title">
            <img src="./images/Text Momentum.png" alt="Text Momentum" class="img-momentum-title">
        </header>

        <nav class="momentum-nav-group">
            <a href="./moving-frame.html" class="btn-mom-item videografi-btn">
                <img src="./images/Tombol videografi.png" alt="Videografi" class="mom-btn-img">
            </a>
            <a href="./frame-moment.html" class="btn-mom-item fotografi-btn">
                <img src="./images/Tombol photografi.png" alt="Fotografi" class="mom-btn-img">
            </a>
            <a href="./credit-momentum.html" class="btn-mom-item credits-btn">
                <img src="./images/Tombol credits 1.png" alt="Credits" class="mom-btn-img">
            </a>
        </nav>

        <a href="./archives.html" class="btn-back-angel-momentum">

        </a>

        <div class="teks-kedip-pink">
            TOUCH body angel for &lt; BACK &gt;
        </div>

    </div>
<script>
    function autoLockViewport() {
    const containers = document.querySelectorAll('[class^="app-container"]');
    const targetWidth = 430;
    const targetHeight = 966; // Samakan base height-nya dengan shaped ideas
    
    const scaleX = window.innerWidth / targetWidth;
    const scaleY = window.innerHeight / targetHeight;
    
    // --- REVISI MATA JŪBI: BUANG ANGKA 1 DI UJUNG RAMALAN ---
    const finalScale = Math.min(scaleX, scaleY); 
    
    containers.forEach(container => {
        container.style.transform = `scale(${finalScale})`;
    });
}

window.addEventListener('resize', autoLockViewport);
window.addEventListener('DOMContentLoaded', autoLockViewport);
    </script>
</body>
</html>
