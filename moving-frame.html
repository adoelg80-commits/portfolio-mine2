<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINE - Moving Frame Video</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="app-container-moving">
        
        <div class="layer-bg-nebula">
            <img src="./images/Background nebula violeet.png" alt="Nebula Violet">
        </div>

        <div class="letter-moving-title">
            <img src="./images/Text Moving frame video.png" alt="Moving frame video">
        </div>

        <a href="./momentum.html" class="layer-angel-fly">
            <img src="./images/gemini fly crop tanpa bulan.png" alt="Angel Terbang Gemini Back">
        </a>

        <div id="rectangle4">
            <div id="video-wrapper" style="width: 100%; height: 100%;">
                <iframe id="main-video-player" 
                        src="https://www.youtube.com/embed/iFwHP9POAyA?enablejsapi=1&rel=0&autoplay=0" 
                        title="MINE Video Player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen 
                        style="width: 100%; height: 100%; border: none; border-radius: 12px;">
                </iframe>
            </div>
        </div>

        <div class="slider-zone-android-moving">
            <div class="frame-slide-black-bg-moving">
                <img src="./images/BACKROND SLIDE BLACK.png" alt="Background Slide Black">
            </div>

            <div class="slider-horizontal-scroll-moving">
                <div class="video-box" onclick="playVideo('u1fMuRVqOps')" style="cursor: pointer;">
                    <img src="./images/video baf sby.png" alt="Icon BAF SBY">
                </div>
                <div class="video-box" onclick="playVideo('iFwHP9POAyA')" style="cursor: pointer;">
                    <img src="./images/video dimsum.png" alt="Icon Dimsum">
                </div>
                <div class="video-box" onclick="playVideo('anNmdpqBGp8')" style="cursor: pointer;">
                    <img src="./images/video baf bpp.png" alt="Icon BAF BPP">
                </div>
            </div>
        </div>

        <a href="./archives.html" class="btn-back-pink-moving">
            TOUCH body angel for &lt; BACK &gt;
        </a>

    </div>

    <script>
    // 1. ENGINE PENGUNCI UKURAN LAYAR HP
    function lockFitLayar() {
        const container = document.querySelector('.app-container-moving');
        if (!container) return;

        const skalaX = window.innerWidth / 430;
        const skalaY = window.innerHeight / 932;
        const skalaFinal = Math.min(skalaX, skalaY, 1);

        container.style.transform = `scale(${skalaFinal})`;
        container.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', lockFitLayar);
    window.addEventListener('DOMContentLoaded', lockFitLayar);

    // 2. ENGINE LOGIKA KLIK TOMBOL (Langsung Mengubah Link Embed YouTube Secara Resmi)
    function playVideo(youtubeID) {
        const player = document.getElementById('main-video-player');
        if(player) {
            // Mengganti isi video iframe sesuai tombol yang diklik tanpa bikin error hantu
            player.src = "https://www.youtube.com/embed/" + youtubeID + "?enablejsapi=1&rel=0&autoplay=1";
        }
    }

    // 3. ENGINE KEMBALIKAN FUNGSI GESER SLIDER DI PC/LAPTOP
    const slider = document.querySelector('.slider-horizontal-scroll-moving');
    if (slider) {
        let isDown = false;
        let startX;
        let scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
            slider.style.cursor = 'grabbing';
        });
        slider.addEventListener('mouseleave', () => {
            isDown = false;
            slider.style.cursor = 'pointer';
        });
        slider.addEventListener('mouseup', () => {
            isDown = false;
            slider.style.cursor = 'pointer';
        });
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 1.5;
            slider.scrollLeft = scrollLeft - walk;
        });
    }
    </script>
</body>
</html>
