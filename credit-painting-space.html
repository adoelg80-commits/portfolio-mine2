<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINE - Credit Painting Space</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /* --- KANVAS FRAME LAYOUT CREDIT HP ABANG (430x932) --- */
        .credit-page-container {
            width: 430px;
            height: 932px;
            background: #000000;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* 1. Satu Gambar Utuh Gabungan Hasil Ekspor Figma Abang */
        .credit-main-bg {
            position: absolute;
            left: 0;
            top: 0;
            width: 430px;
            height: 932px;
            background: url('./images/credit PAINTING SPACE.png') no-repeat;
            background-size: 100% 100%;
            z-index: 1;
        }

        /* 2. TOMBOL GAIB RECTANGLE 5 (Pemicu Kembali ke ARCHIVES) */
        #rectangle5-gaib {
            position: absolute;
            left: 276px;
            top: 185px;
            width: 144px;
            height: 607px;
            background: transparent; /* Murni bening kasat mata */
            z-index: 10;             /* Paling depan biar gampang di-tap jari */
            cursor: pointer;
        }

        .gaib-link {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 3. TEKS PINKY VERTIKAL (Eksotis 90° Sesuai Gambar Lunacy Kedua) */
        .text-pink-rotate-credit {
            position: absolute;
            left: 410px;               /* Mepet kanan mantap di ruang kosong */
            top: 561px;                /* Koordinat Y asli Frame 13 Figma Abang */
            width: 300px;
            transform: rotate(90deg);  /* Mantra Putar Vertikal Sepuh */
            transform-origin: left top;
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-weight: 400;
            font-size: 13px;           /* Ukuran pas biar seksi ramping */
            letter-spacing: 0.22em;
            color: #FF00E5;            /* Neon Pink Merdeka! */
            z-index: 5;
            text-shadow: 0 0 8px rgba(255, 0, 229, 0.7);
            animation: textBlinkPinky 1.5s infinite alternate;
            white-space: nowrap;
        }

        @keyframes textBlinkPinky {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container-review">
        
        <div class="credit-main-bg">
            
            <div id="rectangle5-gaib">
                <a href="painting-space.html" class="gaib-link"></a>
            </div>

        </div>

        <div class="text-pink-rotate-credit">
            TOUCH body angel for &lt; BACK &gt;
        </div>

    </div>
<script>
    function autoLockViewport() {
        const containers = document.querySelectorAll('[class^="app-container"]');
        const targetWidth = 430;
        const targetHeight = 932; 
        
        const scaleX = window.innerWidth / targetWidth;
        const scaleY = window.innerHeight / targetHeight;
        
        const finalScale = Math.min(scaleX, scaleY, 1); 
        
        containers.forEach(container => {
            container.style.transform = `scale(${finalScale})`;
            container.style.transformOrigin = 'center center';
        });
    }

    window.addEventListener('resize', autoLockViewport);
    window.addEventListener('DOMContentLoaded', autoLockViewport);
</script>
</body>
</html>
